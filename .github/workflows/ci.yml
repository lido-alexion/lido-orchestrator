name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q lido_orchestrator tests
  package-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build and install package into disposable venv
        run: |
          python -m venv "$RUNNER_TEMP/lido-venv"
          "$RUNNER_TEMP/lido-venv/bin/python" -m pip install .
          "$RUNNER_TEMP/lido-venv/bin/lido" --db "$RUNNER_TEMP/unused.sqlite3" info
      - name: Exercise two-supervisor recovery on disposable SQLite state
        run: |
          set -eu
          v="$RUNNER_TEMP/lido-venv/bin"
          db="$RUNNER_TEMP/lifecycle.sqlite3"
          project="$RUNNER_TEMP/project"
          mkdir -p "$project"
          "$v/lido" --db "$db" register-project pilot "$project"
          "$v/lido" --db "$db" supervisor register retired pilot worker-old --trusted-local >/dev/null
          "$v/lido" --db "$db" supervisor register replacement-a pilot worker-a --trusted-local >/dev/null
          "$v/lido" --db "$db" supervisor register replacement-b pilot worker-b --trusted-local >/dev/null
          task=$("$v/lido" --db "$db" submit pilot 'disposable recovery smoke' --supervisor retired | python -c 'import json,sys; print(json.load(sys.stdin)["task_id"])')
          "$v/lido" --db "$db" supervisor lifecycle retired deboard --actor ci-smoke >/dev/null
          "$v/lido" --db "$db" supervisor adopt "$task" replacement-a --actor ci-smoke >/dev/null
          if "$v/lido" --db "$db" supervisor adopt "$task" replacement-b --actor ci-smoke >/dev/null 2>&1; then
            echo 'second adoption unexpectedly transferred ownership' >&2; exit 1
          fi
          "$v/lido" --db "$db" approve "$task" --actor ci-smoke >/dev/null
          "$v/lido" --db "$db" reconcile >/dev/null
          python - "$db" "$task" <<'PY'
          import sqlite3, sys
          db, task = sys.argv[1:]
          row = sqlite3.connect(db).execute(
              'select supervisor_id, status, attempts from tasks where id=?', (task,)
          ).fetchone()
          assert row == ('replacement-a', 'dry_run', 1), row
          assert sqlite3.connect(db).execute(
              'select count(*) from dispatch_intents where task_id=?', (task,)
          ).fetchone()[0] == 1
          PY
      - name: Roll back disposable installation
        run: |
          "$RUNNER_TEMP/lido-venv/bin/python" -m pip uninstall -y lido-orchestrator
          test ! -e "$RUNNER_TEMP/lido-venv/bin/lido"
